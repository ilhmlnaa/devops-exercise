name: CiCd for NotesApp Consumer

on:
  push:
    branches: [notesapp-consumer-coolify]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy Application via Coolify
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Trigger Coolify Deployment
        run: |
          echo "Triggering Coolify deployment..."
          curl -X POST "https://coolify.hamdiv.me/api/v1/deploy?uuid=pok8s0kwoggosgc8os00sskw&force=false" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
          -H "Content-Type: application/json"
