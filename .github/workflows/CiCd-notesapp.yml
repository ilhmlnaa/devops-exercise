name: CD

on:
  push:
    branches: [notesapp-consumer]

jobs:
  test:
    name: Run Tests
    environment: AWS
    runs-on: ubuntu-latest
    outputs:
      changes-detected: ${{ steps.check-changes.outputs.changes-detected }}
    steps:
      - name: Check for changes and run tests
        id: check-changes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin
            cd /home/ilham/projects/devops-exercise

            BEFORE_PULL=$(git rev-parse HEAD)

            git pull origin notesapp-consumer

            AFTER_PULL=$(git rev-parse HEAD)

            if [ "$BEFORE_PULL" = "$AFTER_PULL" ]; then
              echo "No new changes detected. Skipping tests."
              echo "changes-detected=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "New changes detected. Running tests..."
            echo "changes-detected=true" >> $GITHUB_OUTPUT
            git status
            npm ci
            npm run lint
            npm run test

  deploy:
    name: Deploy Application
    environment: AWS
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.changes-detected == 'true'
    steps:
      - name: Deploy To AWS EC2 Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin
            cd /home/ilham/projects/devops-exercise

            echo "Deploying application with new changes..."
            pm2 restart notesapp-consumer
