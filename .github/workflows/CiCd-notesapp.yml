name: Test and Deploy with Coolify

on:
  push:
    branches: [notesapp-consumer-coolify]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Bypass Cloudflare for GitHub Action
        if: success()
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v1.1.1
        with:
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}

      - name: Trigger Coolify deployment
        if: success()
        run: |
          echo "Triggering Coolify deployment..."
          curl -X POST "https://coolify.hamdiv.me/api/v1/deploy?uuid=pok8s0kwoggosgc8os00sskw&force=false" \
          -H "Authorization: ${{ secrets.COOLIFY_TOKEN }}" \
          -H "Content-Type: application/json"
